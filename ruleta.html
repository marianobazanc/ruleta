<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Premios</title>
  <link rel="stylesheet" href="ruleta.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
</head>

<body>
  <div class="led-borders">
    <div class="led-strip led-top"></div>
    <div class="led-strip led-bottom"></div>
    <div class="led-strip-vertical led-left"></div>
    <div class="led-strip-vertical led-right"></div>
  </div>

  <div class="rayos-luz">
    <div class="rayo rayo-amarillo"></div>
    <div class="rayo rayo-rosa" style="animation-delay: 1s;"></div>
    <div class="rayo rayo-cian" style="animation-delay: 2s;"></div>
    <div class="rayo rayo-violeta" style="animation-delay: 0.5s;"></div>
  </div>

  <div class="efecto-fondo">
    <!-- Generarás 100 de estos con JS -->
    <span class="particula tipo1"></span>
    <span class="particula tipo2"></span>
    <span class="particula tipo3"></span>
    <span class="particula tipo4"></span>
    <!-- ... -->
  </div>


  <div class="container">
    <div class="wheel-wrapper">
      <canvas id="wheel" width="300" height="300"></canvas>
      <button id="spin" class="wheel-wrapper-button">Girar</button>

      <div id="resultadoCuadro" class="resultado-cuadro" style="display:none;">
        <span id="resultadoTexto"></span>
        <button id="cerrarResultado" class="cerrar-resultado">Cerrar</button>
      </div>
    </div>
  </div>
  <div id="explosion-container" class="explosion-container"></div>


  <script src="ruleta.js"></script>
  <script>
    const fondo = document.querySelector('.efecto-fondo');
    function generarLEDs(clase, cantidad, offset = 0, vertical = false) {
      const strip = document.querySelector(clase);
      for (let i = 0; i < cantidad; i++) {
        const div = document.createElement("div");
        div.className = "led";
        const hue = (i * 30 + offset) % 360;
        div.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
        div.style.animationDelay = `${i * 0.15}s`;
        strip.appendChild(div);
      }
    }
    function showExplosion() {
      const container = document.getElementById("explosion-container");
      container.innerHTML = "";

      for (let i = 0; i < 200; i++) {
        const particle = document.createElement("div");
        particle.className = "explosion-particle";
        particle.style.left = "50%";
        particle.style.top = "50%";
        particle.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        particle.style.animationDelay = `${Math.random() * 0.5}s`;
        particle.style.setProperty("--random-x", `${(Math.random() - 0.5) * 2000}px`);
        particle.style.setProperty("--random-y", `${(Math.random() - 0.5) * 2000}px`);
        container.appendChild(particle);
      }
      
    }




    generarLEDs(".led-top", 50, 0);
    generarLEDs(".led-bottom", 50, 180);
    generarLEDs(".led-left", 30, 0, true);
    generarLEDs(".led-right", 30, 90, true);
    for (let i = 0; i < 100; i++) {
      const span = document.createElement('span');
      span.classList.add('particula', `tipo${i % 4 + 1}`);
      span.style.left = `${Math.random() * 100}%`;
      span.style.top = `${Math.random() * 100}%`;
      span.style.animationDelay = `${Math.random() * 3}s`;
      span.style.animationDuration = `${1 + Math.random() * 2}s`;
      fondo.appendChild(span);
    }
    for (let i = 0; i < 50; i++) { // Puedes ajustar la cantidad
        const img = document.createElement('img');
        img.src = 'logouktransparente.png';
        img.className = 'logo-fondo';
        img.style.position = 'absolute';
        img.style.left = `${Math.random() * 100}%`;
        img.style.top = `${Math.random() * 100}%`;
        img.style.width = `${40 + Math.random() * 60}px`; // Tamaño aleatorio entre 40px y 100px
        img.style.opacity = '0.3'; // Transparencia para que no tape la ruleta
        img.style.pointerEvents = 'none';
        img.style.zIndex = '0';
        fondo.appendChild(img);
      }

    function mostrarResultadoCasino(texto) {
      const cuadro = document.getElementById('resultadoCuadro');
      const resultadoTexto = document.getElementById('resultadoTexto');
      const canvas = document.getElementById('wheel');
      resultadoTexto.innerHTML = '';

      // Animación de letras tipo casino
      texto.split('').forEach((letra, i) => {
        const span = document.createElement('span');
        span.textContent = letra;
        span.className = 'resultado-letra';
        span.style.animationDelay = `${i * 0.07}s`;
        resultadoTexto.appendChild(span);
      });

      // Oculta el canvas de la ruleta
      canvas.style.visibility = 'hidden';

      cuadro.style.display = 'flex';
      setTimeout(() => {
        cuadro.classList.add('mostrar');
        if (window.confetti) {
          // Confeti clásico
          window.confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
          // Confeti con imagen personalizada
          window.confetti({
            particleCount: 40,
            spread: 70,
            origin: { y: 0.6 },
            shapes: ['image'],
            image: './logouktransparente.png', // Ruta a tu imagen
            scalar: 1.2 // Ajusta el tamaño si lo deseas
          });
        }
      }, 100);

      document.getElementById('cerrarResultado').onclick = () => {
        cuadro.classList.remove('mostrar');
        setTimeout(() => {
          cuadro.style.display = 'none';
          // Vuelve a mostrar el canvas de la ruleta
          canvas.style.visibility = 'visible';
        }, 400);
      };
    }

  </script>
  <script src="./confetti.browser.min.js"></script>
</body>

</html>
